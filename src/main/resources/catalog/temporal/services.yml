  temporal:
    image: "temporalio/temporal:{{opt.version}}"
    container_name: "{{app}}-temporal"
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
{{@temporal_search_attrs}}
    ports:
      - "127.0.0.1:{{port.grpc}}:7233"
      - "127.0.0.1:{{port.ui}}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "default", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
