  postgres:
    image: "postgres:{{opt.version}}-alpine"
    container_name: "{{app}}-postgres"
    environment:
      POSTGRES_DB: "{{opt.name}}"
      POSTGRES_USER: "{{opt.user}}"
      POSTGRES_PASSWORD: "{{opt.password}}"
    ports:
      - "127.0.0.1:{{port.main}}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - "{{dir}}/initdb:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      # -h 127.0.0.1 forces TCP: the init-time temp server only listens on the unix socket, so a
      # socket check reports healthy while initdb scripts are still replaying.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U {{opt.user}} -d {{opt.name}}"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 120
    restart: unless-stopped
